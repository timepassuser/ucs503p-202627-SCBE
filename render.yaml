services:
  - type: web
    name: scbe
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free               # no persistent disk: data resets on restart/redeploy; demo accounts are reseeded on boot
    healthCheckPath: /api/health
    autoDeploy: true
    # Only rebuild when app code changes -- docs/journal/report commits are ignored
    buildFilter:
      paths:
        - code/**
        - Dockerfile
        - .dockerignore
        - render.yaml
      ignoredPaths:
        - code/data/**
